name: Bug report
description: Report a reproducible problem in Soul Canvas
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Paste relevant logs, screenshots, or recordings.
      render: shell
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Canvas
        - Image generation
        - Audiobook / TTS
        - Gallery / community
        - Authentication
        - Database
        - Documentation
        - Other
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Browser, OS, device, Node.js version"
